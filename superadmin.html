<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Super Admin — TimeTrack Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f172a;color:#f8fafc;padding:20px;min-height:100vh}
.container{max-width:1100px;margin:0 auto}
h1{margin-bottom:20px}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;margin-bottom:16px}
input,button{padding:10px 14px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#f8fafc;font-size:.95rem;font-family:inherit}
button{background:#3b82f6;cursor:pointer;border:none;font-weight:600}
button:hover{background:#2563eb}button.danger{background:#dc2626}button.success{background:#16a34a}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:10px;text-align:left;border-bottom:1px solid #334155}
th{background:#0f172a;font-weight:600;color:#94a3b8}tr:hover{background:#334155}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.75rem;font-weight:600}
.badge.active{background:#166534;color:#bbf7d0}.badge.expired{background:#7f1d1d;color:#fecaca}.badge.suspended{background:#78350f;color:#fed7aa}
.hide{display:none}
</style>
</head>
<body>
<div class="container">
  <h1>👑 Super Admin — TimeTrack Pro</h1>
  <div id="loginBox" class="card" style="max-width:400px;margin:80px auto">
    <h2 style="margin-bottom:16px">เข้าสู่ระบบ</h2>
    <input id="saUser" placeholder="Username" style="width:100%;margin-bottom:10px" value="admin">
    <input id="saPass" type="password" placeholder="Password" style="width:100%;margin-bottom:10px">
    <button onclick="login()" style="width:100%">เข้าสู่ระบบ</button>
  </div>
  <div id="appBox" class="hide">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2>🏫 โรงเรียนทั้งหมด</h2><button onclick="logout()" style="background:#475569">ออกจากระบบ</button>
      </div>
      <div id="tenantsTable"></div>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script>
let token = localStorage.getItem('sa_token') || '';
async function api(cmd, extra) {
  const r = await fetch(window.APP_CONFIG.MASTER_URL, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ cmd, token, ...extra })
  });
  return r.json();
}
async function login() {
  const u = document.getElementById('saUser').value.trim(); const p = document.getElementById('saPass').value;
  const r = await api('superadmin_login', { username: u, password: p });
  if (!r.success) return alert(r.message);
  token = r.token; localStorage.setItem('sa_token', token); showApp();
}
function logout() { localStorage.removeItem('sa_token'); token = ''; location.reload(); }
function showApp() { document.getElementById('loginBox').classList.add('hide'); document.getElementById('appBox').classList.remove('hide'); loadTenants(); }
async function loadTenants() {
  const r = await api('superadmin_listTenants');
  if (!r.success) return alert('โหลดไม่สำเร็จ');
  const tbl = document.getElementById('tenantsTable');
  if (r.tenants.length === 0) { tbl.innerHTML = '<p style="color:#94a3b8">ยังไม่มีโรงเรียน</p>'; return; }
  tbl.innerHTML = `<table><thead><tr><th>School ID</th><th>ชื่อโรงเรียน</th><th>Owner</th><th>สถานะ</th><th>หมดอายุ</th><th>เหลือ</th><th>จัดการ</th></tr></thead><tbody>
    ${r.tenants.map(t => `<tr>
      <td><code style="font-size:.8rem">${esc(t.schoolId)}</code></td><td>${esc(t.schoolName)}</td><td>${esc(t.ownerEmail)}</td>
      <td><span class="badge ${t.status}">${t.status}</span></td><td>${esc(t.licenseEnd || '-')}</td>
      <td>${t.daysLeft === null ? '-' : t.daysLeft + ' วัน'}</td>
      <td><button onclick="extendLicense('${t.schoolId}')" class="success" style="padding:4px 8px;font-size:.75rem">+30</button>
      <button onclick="toggleStatus('${t.schoolId}','${t.status}')" class="danger" style="padding:4px 8px;font-size:.75rem">${t.status === 'suspended' ? 'ปลดล็อค' : 'ระงับ'}</button></td>
    </tr>`).join('')}</tbody></table>`;
}
async function extendLicense(schoolId) {
  const days = prompt('ต่ออายุกี่วัน?', '30'); if (!days || isNaN(days)) return;
  const r = await api('superadmin_extendLicense', { schoolId, days: parseInt(days, 10) });
  alert(r.message); if (r.success) loadTenants();
}
async function toggleStatus(schoolId, current) {
  const newStatus = current === 'suspended' ? 'active' : 'suspended';
  if (!confirm(`เปลี่ยนสถานะเป็น "${newStatus}" ?`)) return;
  const r = await api('superadmin_setStatus', { schoolId, status: newStatus });
  alert(r.message); if (r.success) loadTenants();
}
function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
if (token) showApp();
</script>
</body>
</html>
